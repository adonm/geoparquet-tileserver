# Overture data access guide:
# https://docs.overturemaps.org/getting-data/cloud-sources/
#
# This is Overture's machine-readable STAC root. The server follows the newest
# release and auto-generates collection URLs from STAC collection IDs.
catalog: "https://stac.overturemaps.org/catalog.json"

# Named catalogs can be selected with ?catalog=<name> or ?catalog=<url>.
catalogs:
  mappinginequality: "https://data.source.coop/cboettig/mappinginequality/stac-collection.json"

# You can override the default catalog at startup:
#   ./geoparquet-tileserver --config config.yaml --catalog https://...
listen: "127.0.0.1:8080"
base_url: "http://127.0.0.1:8080"
# encoded MVT tiles, byte-bounded in-memory LRU
cache_tiles_mb: 256
# hard upper bound for one feature or STAC item search request
max_features: 100000
# geometry simplification in MVT tile units (0 disables)
simplify: 1.0
# optional property projection / stable feature id
# exclude_properties: ["geom_bbox", "bbox"]
# id_column: "id"
preload: false

# Optional pgvs3-backed derived-artifact store and source proxy.
# object_store:
#   url: "http://127.0.0.1:8014"
#   artifacts_bucket: "geoparquet-derived"
#   routes:
#     - prefix: "https://data.source.coop/"
#       bucket: "sourcecoop"
#     - prefix: "https://overturemaps-us-west-2.s3.us-west-2.amazonaws.com/"
#       bucket: "overturemaps-us-west-2"

# Layers are normally generated from the STAC collections automatically.
# Add layers only to rename, subset, or change zoom ranges:
# layers:
#   - name: places
#     collection: place
#     min_zoom: 0
#     max_zoom: 14
