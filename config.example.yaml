# Overture data access guide:
# https://docs.overturemaps.org/getting-data/cloud-sources/
#
# This is Overture's machine-readable STAC root. The server follows the newest
# release and auto-generates collection URLs from STAC collection IDs.
catalog: "https://stac.overturemaps.org/catalog.json"

# Named catalogs can be selected with ?catalog=<name> or ?catalog=<url>.
catalogs:
  mappinginequality: "https://data.source.coop/cboettig/mappinginequality/stac-collection.json"

# You can override the default catalog at startup:
#   ./geoparquet-tileserver --config config.yaml --catalog https://...
listen: "127.0.0.1:8080"
base_url: "http://127.0.0.1:8080"
cache_tiles: 4096
preload: false

# Layers are normally generated from the STAC collections automatically.
# Add layers only to rename, subset, or change zoom ranges:
# layers:
#   - name: places
#     collection: place
#     min_zoom: 0
#     max_zoom: 14
